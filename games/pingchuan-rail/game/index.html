<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骸轨 · 平川地铁</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d0b; }
  canvas { display: block; }
  #hint {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .6em;
    background: radial-gradient(circle at 50% 45%, rgba(10, 14, 10, .55), rgba(6, 8, 6, .9));
    text-align: center; transition: opacity .45s ease;
  }
  .hint-title { font-size: 28px; letter-spacing: .22em; color: #d8e6cf; }
  .hint-line { font-size: 14px; color: #9aa895; max-width: 32em; line-height: 1.7; }
  .hint-keys { font-size: 13px; color: #c6d3bd; letter-spacing: .04em; margin-top: .4em; }
  .hint-tip { font-size: 12px; color: #7d8a78; }
  .hint-start { font-size: 12px; color: #8fa88a; margin-top: 1.2em; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }
  #hint.hidden { opacity: 0; pointer-events: none; }
  /* 结局：完毕后给出重开按钮（用户反馈：走到最后一道白光门就操作不了） */
  #ending {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.1em; background: rgba(6, 8, 6, .82);
    transition: opacity .6s ease;
  }
  #ending.hidden { opacity: 0; pointer-events: none; }
  .ending-title { font-size: 30px; letter-spacing: .3em; color: #d9e8d0; }
  .ending-line { font-size: 14px; color: #9fb39a; letter-spacing: .05em; }
  #restartButton {
    margin-top: .6em; padding: .6em 2.2em; font: 15px/1 "Consolas", monospace;
    letter-spacing: .14em; color: #0b0d0b; background: #b8d4a8; border: 0; border-radius: 2px;
    cursor: pointer;
  }
  #restartButton:hover { background: #d3e8c6; }
  /* 生命值：三个点，被怪打到掉一个 */
  #health {
    position: fixed; left: 16px; top: 14px; font: 18px/1 "Consolas", monospace;
    color: #b8d4a8; letter-spacing: .18em; text-shadow: 0 1px 4px #000; opacity: .85;
  }
  /* 危险晕影：被扫描锥照到时从屏幕边缘透出来，不去洗白 3D 场景（审核第 5 条） */
  #danger {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 140px rgba(226, 138, 74, .95), inset 0 0 40px rgba(255, 214, 160, .6);
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",

<body>
<div id="health">●●●</div>
<div id="ending" class="hidden">
  <div class="ending-title">完毕</div>
  <div class="ending-line">你抵达了那小块淡蓝色的光。它醒了。</div>
  <button id="restartButton">重新开始</button>
</div>
<div id="danger"></div>
<div id="hint">
  <div class="hint-title">骸轨 · 平川地铁</div>
  <div class="hint-line">你是地铁里的一条环节虫。往西，尽头有一小块淡蓝色的光。</div>
  <div class="hint-keys">← → 爬行　·　↑ ↓ 爬到墙上和顶上　·　按住空格蓄力，松手弹射　·　J 咬　·　R 重来</div>
  <div class="hint-tip">按住越久弹得越远（0.75 秒充满）　·　弹射方向就是当前朝向，蓄力时朝向锁住</div>
  <div class="hint-tip">被井口的扫描锥扫到会被送回检查点——躲开那束光。</div>
  <div class="hint-start">按任意键开始</div>
</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================================
// 1. 参数与配色（全部取自 SPEC.md 第 6 节，色值来自小说原文描述）
// ============================================================================
const PARAMETERS = new URLSearchParams(location.search);
let randomSeed = Number(PARAMETERS.get('seed') || 20261116) || 1;
const randomFloat = () => {
  randomSeed = (randomSeed * 16807) % 2147483647;
  return (randomSeed - 1) / 2147483646;
};

const PALETTE = {
  dust: 0xc9c6bd,      // 五十年未扰动的灰白粉尘
  concrete: 0x6b6259,  // 混凝土 / 烧结板块
  rust: 0x7a4a32,      // 锈蚀金属
  armor: 0x2a3b4d,     // 被能量武器贯穿后凝固的暗蓝
  glowGreen: 0x9fb79a, // 淡化冷绿：只有灯管附近带色，避免全场染绿
  worm: 0x7fa88a,      // 蠕虫生物荧光
  cryo: 0xa8d8e8,      // 冷冻舱淡蓝
  fog: 0x5c6357,
};

// 物理常量：都要能被 SPEC 验证，所以集中放一处
const PHYSICS = {
  crawlSpeedOnDust: 4.2,   // 粉尘上爬得慢（原作：粉尘一踩就破）
  crawlSpeedOnMetal: 6.4,  // 金属上快
  chargeSeconds: 0.75,
  launchSpeedMin: 7.0,
  launchSpeedMax: 16.0,
  // 抬升决定「能跳多高」：h = lift²/(2g)。原来 5.0 → 只有 0.78 m，1.8 m 的平台根本上不去。
  // 现在 3.4~8.6 → 0.36~2.31 m，平台可选在 1.6~2.2 m 这一带（仍低于井口 14 m 的多级攀爬设计）。
  launchLiftMin: 3.4,
  launchLiftMax: 8.6,
  gravity: 16.0,
  airControl: 6.0,
  attachTolerance: 0.35,   // 落地吸附的容差（米）
  cornerTolerance: 0.8,    // 拐角接续的容差（米）
  fallDeathY: -8.0,
};

// ============================================================================
// 2. 关卡数据：横线（y=at，x∈[from,to]）与竖线（x=at，y∈[from,to]）
//    kind: dust 减速；metal 保速滑行
//    normalSign: 横面 +1 朝上、-1 朝下；竖面 +1 朝右、-1 朝左
// ============================================================================
const SURFACES = [
  // 站厅
  { axis: 'h', from: 4, to: 96, at: 0, normalSign: 1, kind: 'dust', name: '站台地面' },
  { axis: 'h', from: 10, to: 150, at: 9, normalSign: -1, kind: 'dust', name: '站台顶' },
  // 轨道：三段锈蚀钢轨，两个断口必须弹射跨越
  { axis: 'h', from: 96, to: 108, at: 0.9, normalSign: 1, kind: 'metal', name: '钢轨一' },
  { axis: 'h', from: 114, to: 126, at: 0.9, normalSign: 1, kind: 'metal', name: '钢轨二' },
  { axis: 'h', from: 132, to: 150, at: 0.9, normalSign: 1, kind: 'metal', name: '钢轨三' },
  // 穹顶
  { axis: 'v', from: 0.9, to: 9, at: 150, normalSign: -1, kind: 'dust', name: '穹顶前壁' },
  { axis: 'h', from: 150, to: 196, at: 0.9, normalSign: 1, kind: 'metal', name: '穹顶地面' },
  { axis: 'h', from: 150, to: 196, at: 14, normalSign: -1, kind: 'dust', name: '穹顶顶' },
  { axis: 'v', from: 0.9, to: 14, at: 196, normalSign: -1, kind: 'dust', name: '穹顶后壁' },
  { axis: 'h', from: 196, to: 200, at: 14, normalSign: 1, kind: 'metal', name: '井口平台' },
  // 竖井：之字形梯，靠端点接续往上爬
  { axis: 'v', from: 14, to: 17, at: 200, normalSign: 1, kind: 'metal', name: '竖井壁A' },
  { axis: 'h', from: 200, to: 204, at: 17, normalSign: 1, kind: 'metal', name: '横档一' },
  { axis: 'v', from: 17, to: 23, at: 204, normalSign: -1, kind: 'metal', name: '竖井壁B' },
  { axis: 'h', from: 204, to: 208, at: 23, normalSign: 1, kind: 'metal', name: '横档二' },
  { axis: 'v', from: 23, to: 26, at: 208, normalSign: -1, kind: 'metal', name: '竖井壁C' },
  // 井顶与舱室
  { axis: 'h', from: 208, to: 214, at: 26, normalSign: 1, kind: 'metal', name: '井顶' },

  // 站台地面 (y=0) 与钢轨一 (y=0.9) 之间那道 0.9 m 台阶：跳高上限只有 0.78 m，直接跳不上去。
  // 补一条竖直焊缝面让拐角接续把玩家「爬」上去（审核发现的阻断级问题）。
  // 注意：**必须追加在数组末尾**——插在中间会把后面所有面的索引 +1，破坏测试与逻辑里硬编码的索引。
  { axis: 'v', from: 0, to: 0.9, at: 96, normalSign: -1, kind: 'metal', name: '站台焊缝' },
  // 世界左边界：往左走到底会爬上这道窄壁，而不是掉出世界（用户反馈「场景里会掉下去」）
  { axis: 'v', from: 0, to: 9, at: 4, normalSign: 1, kind: 'metal', name: '站台西端壁' },
  // ---- 平台（2026-11-16 用户要求：加几块能跳上去的平台，让场景活起来）----
  // 一律追加在末尾：插在中间会把后面所有面的索引 +1，破坏测试与角接续的既有顺序。
  // 半高踏步（0.7 m）：满蓄力 0.75 秒才够得上 1.8 m 的平台太累，给一级台阶（约 0.35 蓄力即可）
  { axis: 'h', from: 18, to: 22, at: 0.7, normalSign: 1, kind: 'metal', name: '踏步A' },
  { axis: 'h', from: 36, to: 40, at: 0.7, normalSign: 1, kind: 'metal', name: '踏步B' },
  { axis: 'h', from: 54, to: 58, at: 0.7, normalSign: 1, kind: 'metal', name: '踏步C' },
  { axis: 'h', from: 70, to: 74, at: 0.7, normalSign: 1, kind: 'metal', name: '踏步D' },
  { axis: 'h', from: 22, to: 30, at: 1.8, normalSign: 1, kind: 'metal', name: '站台平台A' },
  { axis: 'h', from: 40, to: 48, at: 2.1, normalSign: 1, kind: 'metal', name: '站台平台B' },
  { axis: 'h', from: 58, to: 66, at: 1.6, normalSign: 1, kind: 'metal', name: '站台平台C' },
  { axis: 'h', from: 74, to: 82, at: 2.2, normalSign: 1, kind: 'metal', name: '站台平台D' },
  // 隧道里那块放在两根钢轨之间（114..120），不挡断口前的起跳路线
  { axis: 'h', from: 116, to: 122, at: 2.2, normalSign: 1, kind: 'metal', name: '隧道平台' },
];

const START = { surfaceIndex: 0, position: 6.0 };
const CRYO_POSITION = new THREE.Vector3(211.0, 27.0, 0);
const SCANNER = { x: 208.0, y: 27.5, halfAngle: 0.62, reach: 16.0, sweepSpeed: 0.45, alertSeconds: 1.5 };
// 0-1：被扫描锥照到的程度，驱动屏幕晕影与主角发光（见 updateScanner）
let alertLevel = 0;
// 仅测试用：钉住扫描角（null = 正常扫掠）
let scannerPin = null;

// ============================================================================
// 3. 场景与后处理
// ============================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141913);
scene.fog = new THREE.FogExp2(0x141913, 0.015);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
camera.position.set(12, 4, 17);

const hemisphere = new THREE.HemisphereLight(PALETTE.concrete, 0x141712, 0.16);
scene.add(hemisphere);
// 惨绿残光：唯一的环境光源，只放四盏
// 灯泡本体：必须"看得见"，否则画面里没有亮点（对比与高光全靠它们）
const tubeMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const flickerLamps = [];
let lampIndex = 0;
const shaftMaterial = new THREE.MeshBasicMaterial({
  color: 0xcfe8b6, transparent: true, opacity: 0.11,
  depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, toneMapped: false,
});
[[28, 7.5], [52, 7.5], [76, 7.5], [100, 6.8], [124, 6.8], [148, 6.8], [170, 8.0], [204, 19.0]].forEach(([lampX, lampY]) => {
  const lamp = new THREE.PointLight(0xb1b7aa, 26.0, 40, 2); // 灯管附近亮，光池保持中性灰
  lamp.position.set(lampX, lampY, 1.6);
  scene.add(lamp);

  const tube = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.10, 0.10), tubeMaterial);
  tube.position.set(lampX, lampY, -1.8);
  scene.add(tube);

  // 两盏灯在闪（其余稳定）：还有电的感觉来自不稳定
  if (lampIndex === 1 || lampIndex === 5) flickerLamps.push({ lamp, tube });
  lampIndex += 1;

  const shaft = new THREE.Mesh(new THREE.ConeGeometry(2.6, lampY, 14, 1, true), shaftMaterial);
  shaft.position.set(lampX, lampY / 2, -1.6);
  scene.add(shaft);

  // 地面光斑：一大片被照亮的区域，这是"有光源"最直接的证据
  const pool = new THREE.Mesh(new THREE.CircleGeometry(3.6, 24),
    new THREE.MeshBasicMaterial({ color: 0xc7c5b8, transparent: true, opacity: 0.42,
      depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
  pool.rotation.x = -Math.PI / 2;
  pool.position.set(lampX, (lampX > 96 ? 0.95 : 0.05), -1.0);
  scene.add(pool);
});

// 墙面粉尘贴片：给平坦的大面加一点变化（熵与细节靠它）
const grimeMaterial = new THREE.MeshBasicMaterial({ color: 0x4b5049, transparent: true, opacity: 0.55, depthWrite: false });
for (let index = 0; index < 40; index += 1) {
  const width = 2 + randomFloat() * 7;
  const height = 0.6 + randomFloat() * 2.4;
  const patch = new THREE.Mesh(new THREE.PlaneGeometry(width, height), grimeMaterial);
  patch.position.set(10 + randomFloat() * 190, 1.0 + randomFloat() * 12, -3.6);
  scene.add(patch);
}
// 跟随主角的极弱冷光：只负责"看得见自己"，不改变整体明暗（可读性 > 真实感）
const wormLight = new THREE.PointLight(0xbfe0d8, 2.2, 9, 2);
scene.add(wormLight);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.7, 0.78));
const gradePass = new ShaderPass({
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 },
    uLift: { value: new THREE.Vector3(0.012, 0.014, 0.010) },
    uGain: { value: new THREE.Vector3(1.02, 1.03, 0.97) },
    uVignette: { value: 0.42 }, uGrain: { value: 0.011 }, uSaturation: { value: 1.0 },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uSaturation; uniform vec3 uLift, uGain; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec3 color = texture2D(tDiffuse, vUv).rgb;
      color = color * uGain + uLift;
      float gray = dot(color, vec3(0.299, 0.587, 0.114));
      color = mix(vec3(gray), color, uSaturation);
      color *= 1.0 - uVignette * smoothstep(0.35, 0.95, length(vUv - 0.5) * 1.25);
      // 粗颗粒：先量化到 ~320 格再取噪声，避免逐像素白点像雪花
      color += (hash(floor(vUv * 320.0) + floor(uTime * 12.0)) - 0.5) * uGrain;
      gl_FragColor = vec4(color, 1.0);
    }`,
});
composer.addPass(gradePass);
composer.addPass(new OutputPass());

// ============================================================================
// 4. 几何：把 SURFACES 画成可见的体块，并补上残骸、粉尘、断口
// ============================================================================
const concreteMaterial = new THREE.MeshStandardMaterial({ color: PALETTE.concrete, roughness: 0.95, metalness: 0.02 });
const rustMaterial = new THREE.MeshStandardMaterial({ color: PALETTE.rust, roughness: 0.65, metalness: 0.55 });
const dustMaterial = new THREE.MeshStandardMaterial({ color: 0xe8e4da, roughness: 0.95, metalness: 0.0 });
const armorMaterial = new THREE.MeshStandardMaterial({ color: PALETTE.armor, roughness: 0.45, metalness: 0.85 });

function buildSurfaceMesh(surface) {
  const thickness = surface.kind === 'metal' ? 0.16 : 0.5;
  const horizontal = surface.axis === 'h';
  const length = surface.to - surface.from;
  // 深度预算：板深 1.6、中心 -1.6 → 前表面 -0.8，永远在主角（z=0.2）之后。
  // 原来是深 6 居中（-3~+3），前表面 +3 直接把主角下半身挡掉（遮挡审计抓到的元凶）。
  const depth = 1.6;
  const geometry = horizontal
    ? new THREE.BoxGeometry(length, thickness, depth)
    : new THREE.BoxGeometry(thickness, length, depth);
  const material = surface.kind === 'metal' ? rustMaterial : (surface.name.includes('顶') ? concreteMaterial : concreteMaterial);
  const mesh = new THREE.Mesh(geometry, material);
  if (horizontal) {
    mesh.position.set((surface.from + surface.to) / 2, surface.at - thickness / 2 * surface.normalSign, -1.6);
  } else {
    mesh.position.set(surface.at + thickness / 2 * surface.normalSign, (surface.from + surface.to) / 2, -1.6);
  }
  scene.add(mesh);
  return mesh;
}
SURFACES.forEach(buildSurfaceMesh);

// 粉尘层：贴在“尘土”横面上的一层薄板，读得出来是灰白粉面
SURFACES.filter((surface) => surface.kind === 'dust' && surface.normalSign === 1).forEach((surface) => {
  const length = surface.to - surface.from;
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(length, 0.08, 1.4), dustMaterial);
  mesh.position.set((surface.from + surface.to) / 2, surface.at + 0.02, -1.5);
  scene.add(mesh);
});

// 断口：两个深坑
[108, 126].forEach((pitStart) => {
  const pit = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 1.6), new THREE.MeshStandardMaterial({ color: 0x171a16, roughness: 1 }));
  pit.position.set(pitStart + 3, -1.6, -1.6);
  scene.add(pit);
});

// 站台残骸：优先用图生 3D 的 GLB（game/assets/debris_wheeled.glb），
// 加载失败就保留程序化方块——**绝不因为一个模型没加载就白屏**。
let debrisModelsLoaded = 0;
const debrisModelsFailed = [];

// 三件残骸各自一个 GLB（图生 3D → Blender 减面归一）。数量与缩放按造型分配。
const DEBRIS_MODELS = [
  { file: 'assets/debris_wheeled_v2.glb', count: 10, small: 0.55, large: 1.05 },
  { file: 'assets/debris_tracked_v2.glb', count: 9, small: 0.55, large: 1.0 },
  { file: 'assets/debris_hunter_v2.glb', count: 8, small: 0.5, large: 0.95 },
];

const debrisLoader = new GLTFLoader();
DEBRIS_MODELS.forEach((model) => {
  debrisLoader.load(model.file, (gltf) => {
    let sourceGeometry = null;
    let sourceMaterial = null;
    gltf.scene.traverse((child) => {
      if (child.isMesh && !sourceGeometry) {
        sourceGeometry = child.geometry;
        sourceMaterial = child.material;
      }
    });
    if (!sourceGeometry) return;
    const instances = new THREE.InstancedMesh(sourceGeometry, sourceMaterial, model.count);
    const matrix = new THREE.Matrix4();
    const quaternion = new THREE.Quaternion();
    for (let index = 0; index < model.count; index += 1) {
      const alongX = 16 + randomFloat() * 176;
      const floor = alongX < 96 ? 0 : 0.9;
      quaternion.setFromEuler(new THREE.Euler(
        (randomFloat() - 0.5) * 0.32,
        randomFloat() * Math.PI * 2,
        (randomFloat() - 0.5) * 0.32));
      const scale = model.small + randomFloat() * (model.large - model.small);
      matrix.compose(
        // 残骸属于「背景细节」：一律放在主角后面（z < -1.2），绝不遮挡主角
      new THREE.Vector3(alongX, floor, -4.6 + randomFloat() * 3.0),
        quaternion,
        new THREE.Vector3(scale, scale, scale));
      instances.setMatrixAt(index, matrix);
    }
    instances.instanceMatrix.needsUpdate = true;
    scene.add(instances);
    debrisModelsLoaded += 1;
  }, undefined, () => {
    debrisModelsFailed.push(model.file);
    console.warn('残骸模型加载失败，保留程序化方块：' + model.file);
  });
});

function surfaceTangent(surface) {
  return surface.axis === 'h' ? new THREE.Vector2(1, 0) : new THREE.Vector2(0, 1);
}
function surfaceNormal(surface) {
  return surface.axis === 'h' ? new THREE.Vector2(0, surface.normalSign) : new THREE.Vector2(surface.normalSign, 0);
}
function surfaceSpeedFactor(surface) {
  return surface.kind === 'metal' ? PHYSICS.crawlSpeedOnMetal : PHYSICS.crawlSpeedOnDust;
}
function positionOnSurface(surface, along) {
  return surface.axis === 'h' ? new THREE.Vector2(along, surface.at) : new THREE.Vector2(surface.at, along);
}
function closestPointOnSurface(surface, point) {
  const clamped = Math.min(surface.to, Math.max(surface.from, surface.axis === 'h' ? point.x : point.y));
  return { along: clamped, position: positionOnSurface(surface, clamped) };
}

// 拐角接续：找另一个表面，它的端点和当前端点重合，且切向垂直
function findCornerSurface(currentSurface, endPoint, movementDirection) {
  const matches = [];
  for (let index = 0; index < SURFACES.length; index += 1) {
    if (index === worm.surfaceIndex) continue;
    const candidate = SURFACES[index];
    const collinear = candidate.axis === currentSurface.axis
      && Math.abs(candidate.at - currentSurface.at) < 0.05;
    if (candidate.axis === currentSurface.axis && !collinear) continue;

    const startPoint = positionOnSurface(candidate, candidate.from);
    const finishPoint = positionOnSurface(candidate, candidate.to);
    for (const [point, along] of [[startPoint, candidate.from], [finishPoint, candidate.to]]) {
      if (point.distanceTo(endPoint) > PHYSICS.cornerTolerance) continue;
      // 这个候选面内部朝哪个方向延伸（用来判断"转弯是否顺着原行进方向"）
      const interior = candidate.axis === 'h'
        ? new THREE.Vector2(along === candidate.from ? 1 : -1, 0)
        : new THREE.Vector2(0, along === candidate.from ? 1 : -1);
      matches.push({ index, along, collinear, interior, forwardScore: interior.dot(movementDirection) });
      break;
    }
  }
  if (matches.length === 0) return null;
  // 优先级：共线接续（直走）> 顺着行进方向 > 取更大的 index（朝井底/舱室方向）
  matches.sort((left, right) => {
    if (left.collinear !== right.collinear) return left.collinear ? -1 : 1;
    if (Math.abs(left.forwardScore - right.forwardScore) > 0.01) return right.forwardScore - left.forwardScore;
    return right.index - left.index;
  });
  return { surfaceIndex: matches[0].index, along: matches[0].along };
}

function detach(velocityX, velocityY) {
  worm.attached = false;
  worm.velocity.set(velocityX, velocityY);
}

// 空中的线段检测：从 from 到 to 是否穿过某个表面
function findLanding(from, to, velocity) {
  let best = null;
  for (let index = 0; index < SURFACES.length; index += 1) {
    const surface = SURFACES[index];
    // 迎面才算落地：速度必须和表面法线相反。离开表面时速度与法线同向，会被排除。
    // 至少 0.5 m/s 迎面速度：站桩/贴边时法向速度≈0，不会再被自己判成撞击
    if (velocity.dot(surfaceNormal(surface)) > -0.5) continue;
    if (surface.axis === 'h') {
      // 用 <= 0 而不是 < 0：走离边缘时起点正好在面上，严格异号会让「同高度的落点」永远接不上
      // （实测改严格后连续通关立刻掉到 37 次死亡）。
      // 「贴边每帧反复脱离/重落」改用下面的一道门槛解决：必须有足够的法向速度才算撞击，
      // 站在面上零速时 velocity·normal ≈ 0，不会把自己判成落地。
      const crossing = (from.y - surface.at) * (to.y - surface.at) <= 0 && from.y !== to.y;
      if (!crossing) continue;
      const ratio = (surface.at - from.y) / (to.y - from.y);
      const hitX = from.x + (to.x - from.x) * ratio;
      if (hitX < surface.from - 0.05 || hitX > surface.to + 0.05) continue;
      const distance = from.distanceTo(new THREE.Vector2(hitX, surface.at));
      if (!best || distance < best.distance) {
        best = { distance, surfaceIndex: index, along: hitX,
                 position: new THREE.Vector2(hitX, surface.at) };
      }
    } else {
      const crossing = (from.x - surface.at) * (to.x - surface.at) <= 0 && from.x !== to.x;
      if (!crossing) continue;
      const ratio = (surface.at - from.x) / (to.x - from.x);
      const hitY = from.y + (to.y - from.y) * ratio;
      if (hitY < surface.from - 0.05 || hitY > surface.to + 0.05) continue;
      const distance = from.distanceTo(new THREE.Vector2(surface.at, hitY));
      if (!best || distance < best.distance) {
        best = { distance, surfaceIndex: index, along: hitY,
                 position: new THREE.Vector2(surface.at, hitY) };
      }
    }
  }
  return best;
}

function attachToSurface(surfaceIndex, along, keepSpeed) {
  const surface = SURFACES[surfaceIndex];
  worm.surfaceIndex = surfaceIndex;
  worm.along = along;
  worm.position.copy(positionOnSurface(surface, along));
  worm.attached = true;
  worm.surfaceName = surface.name;
  if (!keepSpeed) worm.velocity.set(0, 0);
}

function respawn() {
  const checkpoint = worm.checkpoints[worm.checkpointIndex];
  worm.deaths += 1;
  worm.attached = true;
  worm.charge = 0;
  worm.charging = false;
  attachToSurface(checkpoint.surfaceIndex, checkpoint.along, false);
  trail.length = 0;
}


// 重开一局：回到第一个检查点、清空死亡计数与身体轨迹。
// 与 respawn() 的区别：respawn 是"死了被送回"，restart 是"玩家主动重开"，不该计入 deaths。
function restart() {
  worm.deaths = 0;
  worm.checkpointIndex = 0;
  worm.alertSeconds = 0;
  worm.charge = 0;
  worm.charging = false;
  worm.phase = 'play';
  showEnding(false);
  worm.health = 3;
  worm.invulnerable = 0;
  worm.biteTimer = 0;
  worm.biteCooldown = 0;
  resetEnemies();
  updateHealthHud();
  attachToSurface(0, 6, false);
  trail.length = 0;
  // 相机立刻到位，避免重开后从很远的地方慢慢飘回来
  camera.position.set(worm.position.x + worm.facing * 2.4, worm.position.y + 1.8, 16.5);
}
// ============================================================================
// 6.5 巡逻怪：来回走，看到虫子就冲过来打它（2026-11-16 用户要求）
// ============================================================================
const ENEMY = {
  speed: 2.6,          // 巡逻速度（1.9 时在暗场里几乎看不出在走）
  chaseSpeed: 3.0,     // 发现后的追击速度（比虫子慢，但比巡逻快）
  detectX: 7.0,        // 水平发现距离
  detectY: 2.2,        // 垂直容差：不同层不互相发现
  attackRange: 1.0,
  attackCooldown: 1.8,   // 1.2 太紧：3 点生命在 3.6 秒内就被打光，缓到 1.8 秒给玩家反应时间
  damage: 1,
  health: 1,           // 一口咬死
};

// reach 1.5：1.25 时贴脸也常咬空（怪的攻击范围是 1.0，玩家需要一点余量）。
// lunge 0.28：咬的瞬间往前扑一点，既是手感也是"为什么咬得到"的视觉解释。
const BITE = { duration: 0.18, reach: 1.5, cooldown: 0.34, verticalTolerance: 1.3, lunge: 0.28 };

const enemyList = [];

function createEnemy(homeMin, homeMax, y) {
  const group = new THREE.Group();
  const shellMaterial = new THREE.MeshStandardMaterial({
    color: 0x4a3b30, roughness: 0.55, metalness: 0.6,
    emissive: 0x2a1206, emissiveIntensity: 0.6,
  });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), shellMaterial);
  body.scale.set(1.35, 0.72, 1.0);
  group.add(body);

  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.1, 0.34), shellMaterial);
  plate.position.y = 0.17;
  group.add(plate);

  // 两只橙色眼睛：怪的"醒着"全靠这两个点（暗场里也看得见）
  const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0xffb066, toneMapped: false });
  [-0.11, 0.11].forEach((offsetX) => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), eyeMaterial);
    eye.position.set(offsetX, 0.06, 0.26);
    group.add(eye);
  });

  // 六条细腿：只做剪影，不参与动画
  const legMaterial = new THREE.MeshStandardMaterial({ color: 0x2f2620, roughness: 0.9 });
  [-0.18, 0, 0.18].forEach((offsetX) => {
    [-1, 1].forEach((side) => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.22, 0.035), legMaterial);
      leg.position.set(offsetX, -0.12, side * 0.2);
      leg.rotation.x = side * 0.5;
      group.add(leg);
    });
  });

  group.scale.setScalar(1.35);   // 原来太小，站在远处看不出来
  group.position.set((homeMin + homeMax) / 2, y + 0.2, 0.3);
  scene.add(group);
  const enemy = {
    group, eyeMaterial, homeMin, homeMax, y, x: (homeMin + homeMax) / 2,
    facing: 1, state: 'patrol', cooldown: 0, dead: false, lunge: 0,
  };
  enemyList.push(enemy);
  return enemy;
}

// 站台上三只：各自守一段，玩家没法一路冲过去
createEnemy(20, 34, 0);
createEnemy(50, 64, 0);
createEnemy(78, 92, 0);

// 重开一局时把怪复位：否则被咬死的怪不会回来，重开后的关卡是空的。
function resetEnemies() {
  enemyList.forEach((enemy) => {
    enemy.dead = false;
    enemy.group.visible = true;
    enemy.x = (enemy.homeMin + enemy.homeMax) / 2;
    enemy.facing = 1;
    enemy.cooldown = 0;
    enemy.lunge = 0;
    enemy.state = 'patrol';
    enemy.group.position.set(enemy.x, enemy.y + 0.2, 0.3);
  });
}

function updateHealthHud() {
  if (!healthElement) return;
  const pips = '●'.repeat(Math.max(0, worm.health)) + '○'.repeat(Math.max(0, 3 - worm.health));
  healthElement.textContent = pips;
}

function hurtWorm(enemy) {
  if (worm.invulnerable > 0 || worm.health <= 0) return;
  worm.invulnerable = 1.0;
  worm.health -= ENEMY.damage;
  updateHealthHud();
  playSound('crunch', 0.5);
  alertLevel = Math.max(alertLevel, 0.85);
  // 击退改成「贴面后退」而不是「脱离表面 + 抛飞」：
  // 原来会把玩家从平台上打进坑里，一次挨打直接连着死（实测 9 次死亡）。
  const away = Math.sign(worm.position.x - enemy.x) || 1;
  const surface = SURFACES[worm.surfaceIndex];
  if (worm.attached && surface) {
    const pushedAlong = worm.along - away * 1.3;
    worm.along = Math.min(surface.to, Math.max(surface.from, pushedAlong));
    worm.position.copy(positionOnSurface(surface, worm.along));
    worm.slideSpeed = 0;
  } else {
    worm.velocity.set(away * 3.2, 3.0);
  }
  if (worm.health <= 0) {
    worm.health = 3;
    updateHealthHud();
    respawn();
  }
}

function killEnemy(enemy) {
  if (enemy.dead) return;
  enemy.dead = true;
  enemy.group.visible = false;
  playSound('crunch', 0.55);
  spawnDust(new THREE.Vector2(enemy.x, enemy.y));
}

function tryBite() {
  if (worm.biteCooldown > 0) return;
  worm.biteCooldown = BITE.cooldown;
  worm.biteTimer = BITE.duration;
  playSound('bite', 0.6);
  // 咬的时候沿当前面往前扑一小步（不掉面）
  const biteSurface = SURFACES[worm.surfaceIndex];
  if (worm.attached && biteSurface) {
    const lungedAlong = worm.along + worm.facing * BITE.lunge;
    worm.along = Math.min(biteSurface.to, Math.max(biteSurface.from, lungedAlong));
    worm.position.copy(positionOnSurface(biteSurface, worm.along));
  }
  if (biteRingMesh) {
    biteRingMesh.visible = true;
    biteRingMesh.position.set(worm.position.x + worm.facing * 0.55, worm.position.y + 0.12, 0.4);
    biteRingMesh.scale.setScalar(0.4);
    biteRingMesh.material.opacity = 0.9;
  }
  enemyList.forEach((enemy) => {
    if (enemy.dead) return;
    const forward = (enemy.x - worm.position.x) * worm.facing;
    const vertical = Math.abs(enemy.y - worm.position.y);
    if (forward > -0.35 && forward < BITE.reach && vertical < BITE.verticalTolerance) killEnemy(enemy);
  });
}

function updateEnemies(deltaSeconds) {
  enemyList.forEach((enemy) => {
    if (enemy.dead) return;
    enemy.cooldown = Math.max(0, enemy.cooldown - deltaSeconds);
    enemy.lunge = Math.max(0, enemy.lunge - deltaSeconds);
    const deltaX = worm.position.x - enemy.x;
    const deltaY = worm.position.y - enemy.y;
    const seesWorm = Math.abs(deltaY) < ENEMY.detectY && Math.abs(deltaX) < ENEMY.detectX;

    if (seesWorm && Math.abs(deltaX) > ENEMY.attackRange * 0.85) {
      enemy.state = 'chase';
      enemy.facing = Math.sign(deltaX) || enemy.facing;
      enemy.x += enemy.facing * ENEMY.chaseSpeed * deltaSeconds;
      enemy.x = Math.min(enemy.homeMax + 8, Math.max(enemy.homeMin - 8, enemy.x));
    } else if (seesWorm) {
      enemy.state = 'attack';
      enemy.facing = Math.sign(deltaX) || enemy.facing;
      if (enemy.cooldown <= 0) {
        enemy.cooldown = ENEMY.attackCooldown;
        enemy.lunge = 0.2;
        hurtWorm(enemy);
      }
    } else {
      enemy.state = 'patrol';
      enemy.x += enemy.facing * ENEMY.speed * deltaSeconds;
      if (enemy.x <= enemy.homeMin) { enemy.x = enemy.homeMin; enemy.facing = 1; }
      if (enemy.x >= enemy.homeMax) { enemy.x = enemy.homeMax; enemy.facing = -1; }
    }

    // 扑击时前倾一点，让「打你一下」有动作感
    const lungeOffset = enemy.lunge > 0 ? 0.18 : 0;
    // 走路时身体上下起伏：暗场里「剪影在动」比「位置在变」更容易被看见
    const walkBob = enemy.state === 'patrol' ? Math.abs(Math.sin(elapsedSeconds * 7 + enemy.homeMin)) * 0.06 : 0;
    enemy.group.position.set(enemy.x + enemy.facing * lungeOffset, enemy.y + 0.2 + walkBob, -0.7);
    enemy.group.rotation.y = enemy.facing > 0 ? 0 : Math.PI;
    enemy.group.rotation.z = enemy.lunge > 0 ? enemy.facing * 0.25 : 0;
    // 眼睛呼吸：巡逻 3.6 rad/s，追击时 9 rad/s（更急）
    const eyePulse = 0.7 + 0.5 * Math.abs(Math.sin(elapsedSeconds * (enemy.state === 'chase' ? 9 : 3.6)));
    enemy.eyeMaterial.color.setRGB(1, 0.55 * eyePulse, 0.25 * eyePulse);
  });
}

function updateBite(deltaSeconds) {
  worm.biteCooldown = Math.max(0, worm.biteCooldown - deltaSeconds);
  worm.invulnerable = Math.max(0, worm.invulnerable - deltaSeconds);
  if (worm.biteTimer > 0) {
    worm.biteTimer = Math.max(0, worm.biteTimer - deltaSeconds);
    if (biteRingMesh && biteRingMesh.visible) {
      // 用户反馈「攻击后的特效应该快速消掉」：从 0.18-0.22 s 压到约 0.09 s
      biteRingMesh.scale.multiplyScalar(1 + deltaSeconds * 16);
      biteRingMesh.material.opacity = Math.max(0, biteRingMesh.material.opacity - deltaSeconds * 12);
      if (biteRingMesh.material.opacity <= 0.02) biteRingMesh.visible = false;
    }
  }
  // 咬的动作：头往前顶一下（用缩放近似，不做骨骼）
  const biteProgress = worm.biteTimer > 0 ? worm.biteTimer / BITE.duration : 0;
  headGroup.position.x = worm.position.x + worm.facing * (0.12 + biteProgress * 0.22);
  headGroup.position.y = worm.position.y + 0.1;
}

// 音频：三条修好的音效（audio-taste 已过 --strict）。浏览器要求先有用户手势，所以首次按键时才起。

const hintElement = document.getElementById('hint');
const dangerElement = document.getElementById('danger');
const healthElement = document.getElementById('health');
const endingElement = document.getElementById('ending');
const restartButton = document.getElementById('restartButton');
function showEnding(visible) {
  if (!endingElement) return;
  endingElement.classList.toggle('hidden', !visible);
}
if (restartButton) {
  restartButton.addEventListener('click', () => { showEnding(false); restart(); });

function toggleHelp(forceVisible) {
  if (!hintElement) return;
  const shouldShow = typeof forceVisible === 'boolean' ? forceVisible : hintElement.classList.contains('hidden');
  hintElement.classList.toggle('hidden', !shouldShow);

const audioState = { context: null, buffers: {}, ready: false };
let scannerAlerting = false;
let sparkSoundTimer = 2.0;
const AUDIO_FILES = {
  crawl: 'assets/audio/sfx_crawl_v2.mp3',
  launch: 'assets/audio/sfx_launch_v2.mp3',
  hum: 'assets/audio/sfx_tube_hum_v2.mp3',
  dust: 'assets/audio/sfx_dust_c_v2.mp3',
  spark: 'assets/audio/sfx_spark_v2.mp3',
  scan: 'assets/audio/sfx_scan_v2.mp3',
  drone: 'assets/audio/music_deep_drone_v2.mp3',
  bite: 'assets/audio/sfx_bite_v2.mp3',
  crunch: 'assets/audio/sfx_crunch_v2.mp3',
};

async function prepareAudio() {
  if (audioState.context) return;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;
  audioState.context = new AudioContextClass();
  await Promise.all(Object.entries(AUDIO_FILES).map(async ([key, file]) => {
    try {
      const response = await fetch(file);
      const data = await response.arrayBuffer();
      audioState.buffers[key] = await audioState.context.decodeAudioData(data);
    } catch (error) {
      console.warn('音效加载失败：' + file);
    }
  }));
  audioState.ready = true;
  // 底层：30 秒 drone 循环（volume 0.12，只负责"空间是深的"）
  if (audioState.buffers.drone) {
    const drone = audioState.context.createBufferSource();
    drone.buffer = audioState.buffers.drone;
    drone.loop = true;
    const droneGain = audioState.context.createGain();
    droneGain.gain.value = 0.12;
    drone.connect(droneGain).connect(audioState.context.destination);
    drone.start();
  }

  // 环境嗡鸣：低频循环，音量压低（游戏里它只是底噪）
  if (audioState.buffers.hum) {
    const hum = audioState.context.createBufferSource();
    hum.buffer = audioState.buffers.hum;
    hum.loop = true;
    const gain = audioState.context.createGain();
    gain.gain.value = 0.22;
    hum.connect(gain).connect(audioState.context.destination);
    hum.start();
  }
}

function playSound(key, volume = 0.6) {
  if (!audioState.ready || !audioState.buffers[key]) return;
  const source = audioState.context.createBufferSource();
  source.buffer = audioState.buffers[key];
  const gain = audioState.context.createGain();
  gain.gain.value = volume;
  source.connect(gain).connect(audioState.context.destination);
  source.start();
}

const pressed = new Set();
addEventListener('keydown', (event) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
  prepareAudio();
  if (event.code === 'KeyR') { restart(); return; }
  // Esc 随时把说明卡叫回来（一次性教学不可靠）
  if (event.code === 'Escape') { toggleHelp(); return; }
  // J 咬：不管是贴着面还是空中都能咬（空中咬到算奖励）
  if (event.code === 'KeyJ' && worm.phase === 'play') { tryBite(); return; }
  // 先记下「这是不是按下沿」再记录按键：否则 pressed.add 在前，蓄力永远起不来
  const isFirstPress = !pressed.has(event.code);
  pressed.add(event.code);
  if (worm.phase === 'title') { worm.phase = 'play'; toggleHelp(false); return; }
  if (event.code === 'Space' && isFirstPress && worm.attached) { worm.charging = true; worm.charge = 0; }
});
addEventListener('keyup', (event) => {
  pressed.delete(event.code);
  if (event.code === 'Space' && worm.charging) {
    worm.charging = false;
    const surface = SURFACES[worm.surfaceIndex];
    const tangent = surfaceTangent(surface).multiplyScalar(worm.facing);
    const normal = surfaceNormal(surface);
    const speed = PHYSICS.launchSpeedMin + (PHYSICS.launchSpeedMax - PHYSICS.launchSpeedMin) * worm.charge;
    const lift = PHYSICS.launchLiftMin + (PHYSICS.launchLiftMax - PHYSICS.launchLiftMin) * worm.charge;
    detach(tangent.x * speed + normal.x * lift, tangent.y * speed + normal.y * lift);
    playSound('launch', 0.55);
    stoneMesh.material.emissive.setHex(0x000000);
    chargeArcMesh.visible = false;
    worm.charge = 0;
  }
});

// 8. 每帧更新
// ============================================================================
const clock = new THREE.Clock();
let elapsedSeconds = 0;
let frameCount = 0;
let measuredFps = 0;
const dustParticles = [];

// 粉尘粒子池：原来每次落地 new 8 个 Geometry + Material，且全文件 0 处 dispose，
// 长时间游玩会一直涨显存（审核第 5 条）。现在固定 48 个，复用几何与材质。
const DUST_POOL_SIZE = 48;
const dustPool = [];
const dustSharedGeometry = new THREE.SphereGeometry(0.075, 6, 5);
for (let index = 0; index < DUST_POOL_SIZE; index += 1) {
  const material = new THREE.MeshBasicMaterial({ color: PALETTE.dust, transparent: true, opacity: 0 });
  const mesh = new THREE.Mesh(dustSharedGeometry, material);
  mesh.visible = false;
  scene.add(mesh);
  dustPool.push({ mesh, life: 0, drift: new THREE.Vector3() });
}

function spawnDust(position) {
  let spawned = 0;
  for (const entry of dustPool) {
    if (spawned >= 8) break;
    if (entry.life > 0) continue;
    entry.life = 0.8 + randomFloat() * 0.6;
    entry.mesh.visible = true;
    entry.mesh.position.set(position.x, position.y + 0.1, (randomFloat() - 0.5) * 1.6);
    entry.drift.set((randomFloat() - 0.5) * 0.8, 0.6 + randomFloat() * 0.8, 0);
    entry.mesh.material.opacity = 0.55;
    spawned += 1;
  }
}

function updateAttachedMovement(deltaSeconds) {
  const surface = SURFACES[worm.surfaceIndex];
  const horizontalInput = (pressed.has('ArrowRight') ? 1 : 0) - (pressed.has('ArrowLeft') ? 1 : 0);
  const verticalInput = (pressed.has('ArrowUp') ? 1 : 0) - (pressed.has('ArrowDown') ? 1 : 0);
  const alongInput = surface.axis === 'h' ? horizontalInput : verticalInput;
  // 蓄力期间不改朝向：玩家用方向键微调位置时，弹射方向必须保持不动
  if (alongInput !== 0 && !worm.charging) worm.facing = alongInput > 0 ? 1 : -1;

  const speed = surfaceSpeedFactor(surface) * (worm.charging ? 0.25 : 1.0);

  // 惯性（SPEC 3.5）：按住时加速；松手后金属面继续滑行、粉尘面急停
  if (alongInput !== 0) worm.slideSpeed = speed;
  else if (surface.kind === 'metal') worm.slideSpeed *= Math.exp(-1.4 * deltaSeconds);
  else worm.slideSpeed = 0;

  // 滑行量必须用「不随蓄力缩放」的基准速度归一：原来除以 speed（蓄力时 ×0.25），
  // 等于把滑行放大 4 倍，实测蓄力瞬间 21.8 m/s（审核第 2 条）。
  const baseSpeed = surfaceSpeedFactor(surface);
  const carried = alongInput !== 0 ? 0 : (worm.slideSpeed > 0.05 ? worm.slideSpeed / Math.max(baseSpeed, 0.001) : 0);
  let nextAlong = worm.along + alongInput * speed * deltaSeconds + worm.facing * worm.slideSpeed * carried * deltaSeconds;

  if (nextAlong < surface.from || nextAlong > surface.to) {
    // 走到表面尽头：先试拐角接续，否则脱离
    const endAlong = nextAlong < surface.from ? surface.from : surface.to;
    const endPoint = positionOnSurface(surface, endAlong);
    const movementDirection = surface.axis === 'h' ? new THREE.Vector2(worm.facing, 0) : new THREE.Vector2(0, worm.facing);
    const corner = findCornerSurface(surface, endPoint, movementDirection);
    if (corner) {
      attachToSurface(corner.surfaceIndex, corner.along, false);
      return;
    }
    worm.along = endAlong;
    worm.position.copy(endPoint);
    const tangent = surfaceTangent(surface).multiplyScalar(worm.facing);
    detach(tangent.x * speed * 0.6, tangent.y * speed * 0.6);
    return;
  }
  worm.along = nextAlong;
  worm.position.copy(positionOnSurface(surface, nextAlong));
}

function updateAirborne(deltaSeconds) {
  const horizontalInput = (pressed.has('ArrowRight') ? 1 : 0) - (pressed.has('ArrowLeft') ? 1 : 0);
  const verticalInput = (pressed.has('ArrowUp') ? 1 : 0) - (pressed.has('ArrowDown') ? 1 : 0);
  worm.velocity.x += horizontalInput * PHYSICS.airControl * deltaSeconds;
  worm.velocity.y += verticalInput * PHYSICS.airControl * deltaSeconds * 0.8 - PHYSICS.gravity * deltaSeconds;

  const from = worm.position.clone();
  const to = from.clone().add(new THREE.Vector2(worm.velocity.x * deltaSeconds, worm.velocity.y * deltaSeconds));
  const landing = findLanding(from, to, worm.velocity);
  if (landing) {
    const landedSurface = SURFACES[landing.surfaceIndex];
    const incomingSpeed = worm.velocity.length();
    attachToSurface(landing.surfaceIndex, landing.along, true);
    if (landedSurface.kind === 'dust') {
      worm.velocity.set(0, 0);
      spawnDust(worm.position);
      playSound('dust', 0.5);
    } else {
      // 落在锈蚀金属上：保留切向惯性滑行。
      // 注意惯性必须写进 slideSpeed —— 贴面移动只读 slideSpeed，写 velocity 只会让 state.speed 撒谎。
      worm.slideSpeed = Math.min(incomingSpeed * 0.85, PHYSICS.crawlSpeedOnMetal * 1.6);
      worm.velocity.set(0, 0);
      worm.along = Math.min(landedSurface.to, Math.max(landedSurface.from, worm.along));
    }
    return;
  }
  worm.position.copy(to);
  if (worm.position.y < PHYSICS.fallDeathY) respawn();
}

let fullChargeAnnounced = false;

function updateCharging(deltaSeconds) {
  if (!worm.charging) {
    chargeArcMesh.visible = false;
    fullChargeAnnounced = false;
    return;
  }
  worm.charge = Math.min(1, worm.charge + deltaSeconds / PHYSICS.chargeSeconds);
  stoneMesh.material.emissive.setRGB(0.35 * worm.charge, 0.55 * worm.charge, 0.30 * worm.charge);
  stoneMesh.material.emissiveIntensity = 1 + worm.charge * 4;

  // 落点弧：长度 = 水平射程，颜色从青绿渐到白，提醒"已经能跨过去了"
  const speedOfCharge = PHYSICS.launchSpeedMin;
  void speedOfCharge;
  const launchX = PHYSICS.launchSpeedMin + (PHYSICS.launchSpeedMax - PHYSICS.launchSpeedMin) * worm.charge;
  const launchY = PHYSICS.launchLiftMin + (PHYSICS.launchLiftMax - PHYSICS.launchLiftMin) * worm.charge;
  const range = launchX * (2 * launchY) / PHYSICS.gravity;
  chargeArcMesh.visible = true;
  chargeArcMesh.scale.set(range, 1, 1);
  chargeArcMesh.position.set(
    worm.position.x + worm.facing * (range / 2 + 0.35),
    worm.position.y + 0.24, 0.2);
  chargeArcMesh.material.opacity = 0.22 + worm.charge * 0.5;
  chargeArcMesh.material.color.setRGB(0.62 + worm.charge * 0.38, 0.88, 0.54 + worm.charge * 0.4);

  // 满蓄提示：响一声 + 全白一帧（玩家能明确知道"到顶了"）
  if (worm.charge >= 0.999 && !fullChargeAnnounced) {
    fullChargeAnnounced = true;
    playSound('spark', 0.4);
    chargeArcMesh.material.color.setRGB(1, 1, 1);
  }
}

function updateScanner(deltaSeconds) {
  // scannerPin 只给测试用：把扫描角钉住，才能写出确定的「站进锥里必须被抓」断言。
  const angle = scannerPin !== null ? scannerPin
    : Math.sin(elapsedSeconds * SCANNER.sweepSpeed) * SCANNER.halfAngle;
  // 三层锥必须同步旋转，否则会露出一层塑料片
  scannerPivot.rotation.z = -angle;
  // 锥内尘粒下飘并循环（局部坐标，随锥体一起转）
  const positionAttribute = coneDustGeometry.getAttribute('position');
  for (let index = 0; index < positionAttribute.count; index += 1) {
    let nextY = positionAttribute.getY(index) - deltaSeconds * (0.35 + (index % 7) * 0.05);
    if (nextY < -coneHeight / 2) nextY = coneHeight / 2;
    positionAttribute.setY(index, nextY);
  }
  positionAttribute.needsUpdate = true;
  const toWorm = new THREE.Vector2(worm.position.x - SCANNER.x, worm.position.y - SCANNER.y);
  const distance = toWorm.length();
  // 关键修正：three r160 的 Vector2.angle() 返回 [0, 2π)，不是 atan2 的 (−π, π]，
  // 原来 `Math.abs(angle() + π/2 + sweep) < halfAngle` 恒大于 0.95 → 扫描锥**永不触发**。
  // 这里显式算角差并绕回 (−π, π]。
  const beamAngle = -Math.PI / 2 - angle;
  const wormAngle = Math.atan2(toWorm.y, toWorm.x);
  const angularDelta = Math.atan2(Math.sin(wormAngle - beamAngle), Math.cos(wormAngle - beamAngle));
  const inside = distance < SCANNER.reach && Math.abs(angularDelta) < coneHalfAngle;
  const alerting = inside && worm.position.y > 13;
  if (alerting && !scannerAlerting) playSound('scan', 0.35);
  scannerAlerting = alerting;
  if (inside && worm.position.y > 13) {
    worm.alertSeconds += deltaSeconds;
    if (worm.alertSeconds > SCANNER.alertSeconds) { worm.alertSeconds = 0; respawn(); }
  } else {
    worm.alertSeconds = Math.max(0, worm.alertSeconds - deltaSeconds * 0.6);
  }
  // 不再"被扫到就把整层调白"（那会把主角洗成负对比），改成屏幕边缘的危险晕影 + 主角自体发光
  alertLevel += ((alerting ? 1 : 0) - alertLevel) * Math.min(1, deltaSeconds * 6);
  if (dangerElement) dangerElement.style.opacity = (alertLevel * 0.55).toFixed(3);
  wormMaterial.emissiveIntensity = 0.55 + alertLevel * 1.5;
}

// 闪烁灯管：2 Hz 的不稳定电，幅度小（不要变成鬼屋）
function updateFlickerLamps() {
  flickerLamps.forEach((entry, entryIndex) => {
    const phase = Math.floor(elapsedSeconds * 1.2 + entryIndex * 0.7) % 9;
    const dip = phase === 2 || phase === 6 ? 0.45 : 1.0;
    entry.lamp.intensity = 26.0 * dip;
    entry.tube.scale.y = dip < 1 ? 0.4 : 1.0;
  });
}

// 检查点：站台末、断口后、穹顶、井口、井顶。
// 原来只有 3 个，跳断口失败要重爬 24-29 s，惩罚比「被扫描抓」重 3 倍（审核指出）。
const CHECKPOINT_RULES = [
  { minimumIndex: 1, passed: (position) => position.x > 93, record: { surfaceIndex: 0, along: 93 } },
  { minimumIndex: 2, passed: (position) => position.x > 96.5 && position.y > 0.5, record: { surfaceIndex: 2, along: 97 } },
  { minimumIndex: 3, passed: (position) => position.x > 132.5, record: { surfaceIndex: 4, along: 133 } },
  { minimumIndex: 4, passed: (position) => position.x > 152, record: { surfaceIndex: 6, along: 152 } },
  { minimumIndex: 5, passed: (position) => position.x > 197, record: { surfaceIndex: 9, along: 198 } },
  { minimumIndex: 6, passed: (position) => position.y > 25, record: { surfaceIndex: 15, along: 209 } },
];

function updateCheckpoints() {
  CHECKPOINT_RULES.forEach((rule) => {
    if (worm.checkpointIndex < rule.minimumIndex && rule.passed(worm.position)) {
      worm.checkpointIndex = rule.minimumIndex;
      worm.checkpoints[rule.minimumIndex] = rule.record;
    }
  });
}

function updateWormVisual() {
  trail.unshift(new THREE.Vector2(worm.position.x, worm.position.y));
  if (trail.length > TRAIL_LENGTH) trail.length = TRAIL_LENGTH;

  const headPosition = trail[0];
  headGroup.position.set(headPosition.x, headPosition.y, 0.25);
  const direction = trail.length > 3
    ? new THREE.Vector2(trail[0].x - trail[3].x, trail[0].y - trail[3].y)
    : new THREE.Vector2(worm.facing, 0);
  headGroup.rotation.z = Math.atan2(direction.y, direction.x);
  const chargeSquash = worm.charging ? 1 - worm.charge * 0.35 : 1;
  headGroup.scale.set(chargeSquash, 1 + worm.charge * 0.4, 1);

  // 复用临时对象：原来每帧每节 new 一个 Matrix4 + Vector3（22 节 ≈ 68 个对象/帧，60 fps ≈ 4000/s）
  const matrix = wormMatrixScratch;
  const quaternion = wormQuaternionScratch;
  for (let index = 0; index < SEGMENT_COUNT; index += 1) {
    const trailIndex = Math.min(trail.length - 1, index * 3);
    const point = trail[trailIndex] || headPosition;
    const taper = 1 - (index / SEGMENT_COUNT) * 0.55;
    const radius = 0.22 * taper;
    const offsetSign = index % 2 === 0 ? 1 : -1;
    wormPositionScratch.set(point.x, point.y + offsetSign * 0.045 * taper, 0);
    wormScaleScratch.set(radius * 1.1, radius * 0.85, radius);
    matrix.compose(wormPositionScratch, quaternion, wormScaleScratch);
    bodyMesh.setMatrixAt(index, matrix);
  }
  bodyMesh.instanceMatrix.needsUpdate = true;
}

function updateDustParticles(deltaSeconds) {
  for (const entry of dustPool) {
    if (entry.life <= 0) continue;
    entry.life -= deltaSeconds;
    entry.mesh.position.addScaledVector(entry.drift, deltaSeconds);
    entry.mesh.material.opacity = Math.max(0, entry.life * 0.55);
    if (entry.life <= 0) {
      entry.life = 0;
      entry.mesh.visible = false;
      entry.mesh.material.opacity = 0;
    }
  }
}

// 相机的横向提前量：单独平滑，避免跟随 facing 突变（审核第 8 条）
let lookAhead = 0;

function updateCamera(deltaSeconds) {
  // 侧视 2.5D：俯角 8-12 度 + 纵向滞后，让"地下"有纵深（见 SPEC 第 4 节）
  // 横向提前量单独平滑：直接跟着 facing 跳会让镜头每次转身横甩 4.8 m（23% 屏宽）
  const desiredLookAhead = worm.facing * 2.4;
  lookAhead += (desiredLookAhead - lookAhead) * (1 - Math.exp(-3.2 * deltaSeconds));
  const targetX = worm.position.x + lookAhead;
  const targetY = worm.position.y + 1.8;
  const damping = 1 - Math.exp(-6 * deltaSeconds);
  camera.position.x += (targetX - camera.position.x) * damping;
  camera.position.y += (targetY - camera.position.y) * damping * 0.8;
  camera.position.z = 16.5;
  camera.lookAt(camera.position.x + 0.6, camera.position.y - 1.1, 0);
  // SPEC 第 4 节承诺的「抵达竖井/终点时推镜」：2.5 秒把 FOV 从 40 收到 34
  if (worm.phase === 'end') {
    const targetFov = 34;
    camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-1.2 * deltaSeconds));
    camera.updateProjectionMatrix();
  } else if (Math.abs(camera.fov - 40) > 0.05) {
    camera.fov += (40 - camera.fov) * (1 - Math.exp(-4 * deltaSeconds));
    camera.updateProjectionMatrix();
  }
}

function updatePhase() {
  if (worm.phase === 'play' && worm.position.x > CRYO_POSITION.x - 1.6 && worm.position.y > 24) {
    showEnding(true);
    worm.phase = 'end';
    document.getElementById('hint').classList.add('hidden');
  }
}

function frame() {
  const deltaSeconds = Math.min(clock.getDelta(), 1 / 20);
  elapsedSeconds += deltaSeconds;
  frameCount += 1;
  if (frameCount % 30 === 0) measuredFps = Math.round(1 / Math.max(deltaSeconds, 1e-4));

  if (worm.phase === 'play') {
    if (worm.attached) updateAttachedMovement(deltaSeconds); else updateAirborne(deltaSeconds);
    updateCharging(deltaSeconds);
    updateCheckpoints();
    updateScanner(deltaSeconds);
  updateFlickerLamps();
  updateSparks(deltaSeconds);
  updateEnemies(deltaSeconds);
  updateBite(deltaSeconds);
  }
  updateWormVisual();
  updateDustParticles(deltaSeconds);
  updateCamera(deltaSeconds);
  updatePhase();
  wormLight.position.set(worm.position.x, worm.position.y + 0.6, 1.2);
  parallaxLayers.forEach((layer) => {
    layer.group.position.x = camera.position.x * layer.offsetX * -1;
  });
  dustField.position.x = camera.position.x * 0.35;
  gradePass.uniforms.uTime.value += deltaSeconds;
  // 参考片驱动：站台段降饱和，灯附近留色；隧道与竖井保留原设定。
  gradePass.uniforms.uSaturation.value = worm.position.x < 96 ? 0.65 : 1.0;
  composer.render();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ============================================================================
// 9. 对外状态契约（试玩脚本只读它，绝不写游戏）
// ============================================================================
window.__game = {
  get state() {
    return {
      phase: worm.phase,
      x: Number(worm.position.x.toFixed(3)),
      y: Number(worm.position.y.toFixed(3)),
      // 贴面时真实速度是 slideSpeed（惯性），velocity 只在空中有效——
      // 原来贴面也报 velocity.length()，会给出「13.7 m/s 但角色不动」的假数据。
      speed: Number((worm.attached ? worm.slideSpeed : worm.velocity.length()).toFixed(3)),
      renderCalls: renderer.info.render.calls,
      health: worm.health,
      enemies_alive: enemyList.filter((enemy) => !enemy.dead).length,
      bite_cooldown: Number(worm.biteCooldown.toFixed(2)),
      attached: worm.attached,
      surface: worm.surfaceName,
      // 自动试玩要知道当前是竖面还是横面，才能决定按上还是按右
      axis: worm.attached ? SURFACES[worm.surfaceIndex]?.axis ?? 'h' : 'air',
      charge: Number(worm.charge.toFixed(3)),
      deaths: worm.deaths,
      progress: Number(Math.min(1, worm.position.x / CRYO_POSITION.x).toFixed(3)),
      models_loaded: debrisModelsLoaded,
      models_failed: debrisModelsFailed.length,
      fps: measuredFps,
    };
  },
};

if (PARAMETERS.has('debug')) {
  // 仅供 tests/smoke_game.mjs 使用：把虫子放到指定表面，验证拐角接续。
  window.__game.debug = {
    restart,
    pinScanner(value) { scannerPin = value; },
    setFacing(value) { worm.facing = value >= 0 ? 1 : -1; },
    enemyPositions() { return enemyList.map((enemy) => ({ x: enemy.x, y: enemy.y, dead: enemy.dead })); },
    enemyGroups() { return enemyList.map((enemy) => ({ x: enemy.group.position.x, z: enemy.group.position.z, visible: enemy.group.visible })); },
    // 遮挡审计：从相机向主角打一条射线，返回挡在中间的对象。
    // 这是「主角是否被挡住」的机械判据——不用靠人眼反复看截图。
    occluders() {
      const raycaster = new THREE.Raycaster();
      const origin = camera.position.clone();
      const target = new THREE.Vector3(worm.position.x, worm.position.y + 0.1, 0.2);
      const distance = origin.distanceTo(target);
      raycaster.set(origin, target.clone().sub(origin).normalize());
      raycaster.far = Math.max(0.1, distance - 0.4);
      const ignore = new Set([bodyMesh, headGroup, stoneMesh, chargeArcMesh, biteRingMesh]);
      const names = [];
      for (const hit of raycaster.intersectObjects(scene.children, true)) {
        if (hit.object.isPoints) continue;
        if (hit.object.material && hit.object.material.transparent && hit.object.material.opacity < 0.4) continue;
        let node = hit.object;
        let skipped = false;
        while (node) { if (ignore.has(node)) { skipped = true; break; } node = node.parent; }
        if (skipped) continue;
        const worldPosition = new THREE.Vector3();
        hit.object.getWorldPosition(worldPosition);
        const color = hit.object.material && hit.object.material.color
          ? '#' + hit.object.material.color.getHexString() : 'none';
        names.push((hit.object.name || (hit.object.geometry && hit.object.geometry.type) || hit.object.type)
          + ' xy=' + worldPosition.x.toFixed(1) + ',' + worldPosition.y.toFixed(1)
          + ' z=' + worldPosition.z.toFixed(1) + ' color=' + color);
      }
      return names;
    },
    setEnemyPosition(index, x) {
      const enemy = enemyList[index];
      if (!enemy) return;
      enemy.x = x;
      enemy.group.position.x = x;
    },
    teleportToSurface(surfaceIndex, along) {
      attachToSurface(surfaceIndex, along, false);
      trail.length = 0;
    },
    surfaceNames() { return SURFACES.map((surface, index) => index + ':' + surface.name); },
  };
}

if (worm.phase === 'play') document.getElementById('hint').classList.add('hidden');
frame();
</script>
